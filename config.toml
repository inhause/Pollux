# ----- Pollux Mango ------- #
# This config should live at #
# ---- ~/.config/mango ----- #

# The config should reload automatically
# when changes are made. If not, 
# use SUPER+SHIFT+R

# Generic
[global]
sloppy_focus = 0
allow_tearing = 2
auto_reload_config = 1


# Load the rest of the config
source = [
    "./cfg/var.toml",
    "./cfg/env.toml",
    "./cfg/visual.toml",
    "./cfg/keymap.toml",
    "./cfg/input.toml",
    "./cfg/layout.toml",
    "./cfg/rules.toml",
]

# Autostart script for anything that needs it
# (Primarily Noctalia, in our use case)
exec_once = ["~/.config/mango/cfg/autostart.sh"]
