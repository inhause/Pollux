# ~/.config/mango/ #
# Reload live with SUPER + Shift + R #
# Everything this file runs lives in ~/.config/mango #

[global]

# Generic
sloppy_focus = 0
allow_tearing = 2
drag_tile_to_tile = 1
auto_reload_config = 1

# Look
border_px = 4
border_radius = 10
gap_inner_horizontal = 16
gap_inner_vertical = 16
gap_outer_vertical = 12
gap_outer_vertical = 12
focus_color=0x80a0ffff
border_color=0x080808ff
urgent_color=0xef9f76ff

# Effect
blur = 0
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2
shadows = 1
shadow_only_floating = 1
layer_shadows = 1
shadows_size = 12
shadows_blur = 18
shadows_color = 0x00000099
animations = 1
layer_animations = 1
animation_type_open = slide
animation_type_close = slide
animation_fade_in = 1
animation_fade_out = 1
animation_duration_open = 300
animation_duration_close = 250
animation_duration_tag = 250
animation_duration_move = 250
animation_curve_open = [0.46, 1.0, 0.29, 1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close=[0.08, 0.92, 0, 1]
animation_curve_opacity_fade_out = [0.58, 0.98, 0.58, 0.98]
animation_curve_opacity_fade_in = [0.46, 1.0, 0.29, 1]


# Load the rest of the config
source = [
    "./cfg/var.toml",
    "./cfg/keymap.toml",
    "./cfg/input.toml",
    "./cfg/layout.toml"
]
