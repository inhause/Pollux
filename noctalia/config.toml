config_version = 15

[bar]
order = [ "default", "Edward" ]

    [bar.Edward]
    background_opacity = 0.669999985024333
    center = [ "active_window" ]
    end = [
        "group:g1",
        "spacer_5",
        "tray",
        "network",
        "bluetooth",
        "spacer_7",
        "volume",
        "spacer_4",
        "battery",
        "spacer_3",
        "control-center",
        "spacer_2"
    ]
    font_family = "JetBrainsMono NF"
    margin_ends = 0
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    radius_top_left = 0
    radius_top_right = 0
    shadow = false
    start = [ "date", "clock", "spacer_1", "workspaces" ]
    thickness = 22

        [[bar.Edward.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "media", "spacer_6", "Separator" ]
        opacity = 1.0
        padding = 6.0

    [bar.default]
    center = [ "date", "Separator", "clock", "ClockNotSpacer", "notifications" ]
    concave_edge_corners = false
    enabled = false
    end = [ "tray", "clipboard", "network", "bluetooth", "volume", "brightness", "battery" ]
    margin_edge = 5
    margin_ends = 10
    radius = 8
    scale = 1.0500000081956387
    thickness = 40

[control_center]
width = 890

