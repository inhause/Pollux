[notification]
background_opacity = 0.669999985024333

[osd]
background_opacity = 0.669999985024333

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell.launcher]
app_grid = true

[shell.panel]
control_center_placement = "floating"
control_center_position = "top_right"
launcher_position = "top_left"
open_near_click_control_center = true
transparency_mode = "soft"

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/hause/Pictures/Wallpapers/wallhaven-n65epw.png"

    [wallpaper.last]
    path = "/home/hause/Pictures/Wallpapers/wallhaven-n65epw.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/hause/Pictures/Wallpapers/wallhaven-n65epw.png"

    [[wallpaper.favorite]]
    path = "/home/hause/Pictures/Wallpapers/wall.jpg"

[weather]
unit = "imperial"

[widget.ClockNotSpacer]
scale = 0.5
type = "spacer"

[widget.Separator]
anchor = true
enabled = false
scale = 0.75
text = "|"
type = "text"

[widget.active_window]
display = "text_only"
max_length = 315
scale = 0.90000000000000002
title_scroll = "on_hover"

    [widget.active_window.actions]
    left = "window-switcher"
    right = "annotate"

[widget.battery]
scale = 0.80000000000000004

[widget.clock]
anchor = true
scale = 0.80000000000000004

[widget.control-center]
glyph = "adjustments-filled"

[widget.date]
enabled = false
format = "{:%a %d}"
scale = 1.05

[widget.launcher]
custom_image = "/usr/share/icons/hicolor/scalable/apps/org.cachyos.scx-manager.png"

[widget.media]
art_size = 14
capsule = true
font_family = "JetBrainsMono NF"
font_scale = 0.90000000000000002
hide_when_no_media = true
rotate_album_art = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.spacer_1]
scale = 1.25
type = "spacer"

[widget.spacer_2]
font_scale = 0.5
length = 3
type = "spacer"

[widget.spacer_3]
scale = 0.65000000000000002
type = "spacer"

[widget.spacer_4]
scale = 0.5
type = "spacer"

[widget.spacer_5]
length = 15
type = "spacer"

[widget.spacer_6]
length = 8
type = "spacer"

[widget.spacer_7]
length = 7
type = "spacer"

[widget.tray]
drawer = true

[widget.volume]
scale = 0.80000000000000004

[widget.workspaces]
active_pill_size = 1.25
focused_output_only = true
hide_when_empty = true
inactive_pill_size = 1.25
occupied_color = "on_tertiary"
