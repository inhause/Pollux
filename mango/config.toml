# ----- Pollux Mango ------- #
# This config should be symlinked
#    to `~/.config/mango`

# The config should reload automatically
# when changes are made. If not,
# use SUPER+SHIFT+R

# Load the rest of the config
source = [
    "./cfg/var.toml",
    "./cfg/env.toml",
    "./cfg/visual.toml",
    "./cfg/keymap.toml",
    "./cfg/input.toml",
    "./cfg/layout.toml",
    "./cfg/rules.toml",
]

# Autostart script for anything that needs it
# (Primarily Noctalia, in our use case)
exec_once = ["$pollux/mango/cfg/autostart.sh"]
